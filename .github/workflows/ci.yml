name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check version sync
        run: node scripts/check-version-sync.js

  launcher:
    name: Launcher
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Run launcher tests
        run: pnpm run test:launcher

  docs:
    name: Docs (${{ matrix.environment }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      matrix:
        environment: [production, preview]
    env:
      VERCEL_ENV: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test original documentation contract
        run: pnpm --filter docs test

      - name: Typecheck documentation
        run: pnpm --filter docs type-check

      - name: Build documentation
        run: pnpm --filter docs build

      - name: Verify public documentation routes
        run: pnpm --filter docs test:routes ${{ matrix.environment == 'preview' && '--preview' || '' }}

  rust:
    name: Rust
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Format check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy check
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml

  dashboard:
    name: Dashboard
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --filter dashboard
        working-directory: packages/dashboard

      - name: Build dashboard
        run: pnpm build
        working-directory: packages/dashboard

  sandbox-package:
    name: Sandbox Package
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test sandbox package
        run: pnpm --filter @agent-browser/sandbox test

  eve-package:
    name: Eve Package
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Eve package
        run: pnpm --filter @agent-browser/eve typecheck

      - name: Test Eve package
        run: pnpm --filter @agent-browser/eve test

  rust-cross:
    name: Rust (${{ matrix.os }} - ${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

  native-e2e:
    name: Native E2E Tests
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install Chrome
        run: |
          cargo run --manifest-path cli/Cargo.toml -- install --with-deps

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Obscura test engine
        run: |
          mkdir -p "$RUNNER_TEMP/obscura"
          curl -fsSL https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.4/obscura-x86_64-linux.tar.gz -o "$RUNNER_TEMP/obscura.tar.gz"
          echo "757e7b597ba5cdd53af9fc701e0a9b80f0a8d788f545d4f82ec9ad32db77f000  $RUNNER_TEMP/obscura.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/obscura.tar.gz" -C "$RUNNER_TEMP/obscura"
          echo "OBSCURA_BIN=$RUNNER_TEMP/obscura/obscura" >> "$GITHUB_ENV"

      - name: Run e2e tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e -- --ignored --test-threads=1

  global-install:
    name: Global Install (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: rust-cross
    strategy:
      matrix:
        include:
          - os: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            binary: agent-browser-linux-x64
          - os: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Stage the built CLI for packaging
        run: cp cli/target/${{ matrix.target }}/release/agent-browser bin/${{ matrix.binary }}

      - name: Test npm global install
        run: |
          npm pack
          npm install -g agent-browser-*.tgz
          agent-browser --version
        shell: bash


      - name: Verify the installed native binary
        run: |
          installed_binary=$(command -v agent-browser)
          target=$(readlink "$installed_binary")
          [[ "$target" == *"${{ matrix.binary }}"* ]]
          cmp cli/target/${{ matrix.target }}/release/agent-browser "$installed_binary"
        shell: bash
